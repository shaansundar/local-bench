[project]
name = "local-bench"
version = "0.1.0"
description = "Run 42 LLM benchmarks on your own Mac against local and cloud models, with a live dashboard. No Docker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaan Sundar" }]
requires-python = ">=3.12,<3.14"
keywords = ["llm", "benchmark", "evaluation", "evals", "local-llm", "mlx", "apple-silicon", "opencode", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "pydantic>=2.7",
  "httpx>=0.27",
  "anthropic>=0.70",
  "python-dotenv>=1.0",
  "json5>=0.9",
  "datasets>=3.0",
  "huggingface_hub>=0.25",
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "math-verify[antlr4_13_2]>=0.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # IFEval / IFBench / Multi-IF checkers
  "langdetect>=1.0.9",
  "nltk>=3.9",
  "absl-py>=2.1",
  "immutabledict>=4.2",
  "emoji>=2.12",
  "syllapy>=0.7",
  "pythainlp>=5.0",
  "h5py>=3.11",          # SciCode test targets
  # presentations (PPTBench judges, PPTArena)
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pdf2image>=1.17",
  "thefuzz>=0.22",
  "pypdfium2>=4.30",
  # OmegaUse-OfficeVal verifiers
  "pdfplumber>=0.11",
  "lxml>=5.0",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
  # LongBench Pro metrics
  "jieba>=0.42",
  "rouge>=1.0.1",
  "pytrec-eval-terrier>=0.5.6",
  # keyless web search tool
  "ddgs>=9.0",
  "trafilatura>=1.12",
  "mcp>=1.9",
]

[project.urls]
Homepage = "https://github.com/shaansundar/local-bench"
Documentation = "https://github.com/shaansundar/local-bench#readme"
Issues = "https://github.com/shaansundar/local-bench/issues"
Changelog = "https://github.com/shaansundar/local-bench/blob/main/CHANGELOG.md"

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# vendor/ holds upstream harnesses with their own (sometimes network-bound) test suites
norecursedirs = ["vendor", "data", "results", "web", ".venv", "node_modules"]
