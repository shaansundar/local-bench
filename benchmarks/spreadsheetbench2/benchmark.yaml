license: see repository
notes: Adapted — the official SWE-agent Docker environment is replaced by opencode in the macOS sandbox (instructions follow the official instance template; a view_xlsx.py helper stands in for the view_xlsx tool). The Visualization category is excluded (its evaluator exports charts through Excel/WPS COM on Windows). Requires LibreOffice.
