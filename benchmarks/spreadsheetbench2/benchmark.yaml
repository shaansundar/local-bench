slug: spreadsheetbench2
title: SpreadsheetBench 2
category: Spreadsheet
description: End-to-end business spreadsheet workflows (NeurIPS 2026) — Debugging (100 audit/fix tasks), Financial_Model (100 multi-sheet models), Template (97 completions). The opencode agent edits the input workbook with Python/openpyxl and writes the output file; graded with the official cell-level comparison over the answer range (font-color / formula modes where the official evaluator uses them) after LibreOffice recalculation. Stratified by category.
runner: oc
metric: accuracy
sample_timeout_s: 3600
badges: [adapted]
sources:
