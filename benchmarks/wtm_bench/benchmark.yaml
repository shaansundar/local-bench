slug: wtm_bench
title: WTM-Bench (Workbook Time Machine)
category: Spreadsheet
description: Microsoft's realistic multi-artifact Excel automation benchmark — 150 tasks reconstructed from real workbook histories (Enron), level-5 (vague, realistic) phrasing. Run with the official benchmark.py multi-turn tool loop (model writes openpyxl/pandas code) and the official structural + cell-level grader, inside the sandbox.
runner: native
metric: mean score
sample_timeout_s: 3600
stratify: false
options:
