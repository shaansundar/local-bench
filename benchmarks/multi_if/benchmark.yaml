slug: multi_if
title: Multi-IF
category: Instruction following
description: 3-turn, multilingual (8 languages) instruction-following conversations; each turn adds verifiable constraints. Score per conversation = mean over the 3 turns of the average of prompt/instruction-level strict/loose accuracy (Multi-IF paper convention). Stratified by language.
runner: chat
metric: average accuracy over 3 turns
max_tokens: 16384
