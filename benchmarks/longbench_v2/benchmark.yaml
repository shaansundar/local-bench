slug: longbench_v2
title: LongBench v2
category: Long context
description: 503 challenging multiple-choice questions over 8k–2M-word contexts (single/multi-doc QA, long ICL, dialogue history, code repos, structured data). Contexts longer than the model's window are truncated in the middle (official convention). Stratified by difficulty × length.
