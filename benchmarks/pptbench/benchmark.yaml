slug: pptbench
title: PPTBench (understanding + detection)
category: Presentation
description: PowerPoint slide comprehension from PPTBench — multiple-choice slide understanding (chart, table, layout, text questions; slide image + slide JSON) and detection (content extraction, element bounding boxes, style attributes from slide JSON). Official prompts and judges. Stratified by subset/task.
runner: chat
metric: accuracy
max_tokens: 16384
badges: [partial]
sources:
