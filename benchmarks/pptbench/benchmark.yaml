license: see repository
notes: Partial — the Modification subset needs the full-deck JSON corpus and the Generation subset needs an external image pack plus an LLM judge; both are not included yet. The official answer parser falls back to eval() on model output, so answers are parsed with JSON/literal parsing instead (same accepted formats, no code execution).
