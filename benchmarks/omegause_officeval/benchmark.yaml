category: Office docs
description: Long-horizon office-suite tasks with economic grounding (Baidu, 2026) — editing and producing Word, Excel, PowerPoint and PDF deliverables (≈2.3 human-hours each). The opencode agent works on the task's input files and saves deliverables; the official per-task verifier scores them (completion = max(0,total)/max, 0 if the deliverable check fails). The 9 verifiers that need Microsoft Office COM are excluded (91 tasks).
