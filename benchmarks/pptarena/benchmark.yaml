license: MIT
notes: Adapted — PPTArena's judge code targets Gemini/OpenAI/OpenRouter clients; here its pptx_to_json, structural diff and verbatim rubrics/system prompts run on the suite's fixed (vision-capable) judge, with all slides compared in one call (capped by max_slides). Requires LibreOffice for rendering.
